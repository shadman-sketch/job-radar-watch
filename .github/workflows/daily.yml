name: Daily watchlist check

on:
  schedule:
    - cron: "15 10 * * *"   # 10:15 UTC = 5:15 AM CDT / 4:15 AM CST, before the 6:52 AM dashboard update
  push:
    branches: [main]
    paths: ["checker/**", "data/companies.csv", ".github/workflows/**", "requirements.txt"]
  workflow_dispatch:
    inputs:
      rediscover_all:
        description: "Re-detect the job system for every company"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Detect job systems (new or unresolved companies only)
        run: python checker/discover.py ${{ github.event.inputs.rediscover_all == 'true' && '--all' || '' }}

      - name: Check every company
        run: python checker/run.py

      - name: Save results
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data/resolved.json results
          git commit -m "Watchlist run $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash
          git push
