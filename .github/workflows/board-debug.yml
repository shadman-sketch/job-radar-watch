name: Board quick check

on:
  push:
    branches: [main]
    paths: ["checker/boards.py", "data/boards.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Read each job board once
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "checker")
          from boards import fetch_board
          from match import title_ok
          for bd in json.load(open("data/boards.json")):
              jobs, err = fetch_board(bd)
              roles = [j for j in (jobs or []) if title_ok(j.get("title") or "")]
              print(bd["name"], "jobs:", len(jobs or []), "role matches:", len(roles), "error:", err)
              for j in roles[:40]:
                  print("  ", j["title"], "|", j["company"], "|", j["location"])
          PY
      - name: Save debug output
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add results/board_debug_*.json
          git commit -m "Board debug $(date -u +%FT%H%M)" || echo "nothing to commit"
          git pull --rebase --autostash
          git push
